<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRN Validator</title>
    <style>
        body {
            background: linear-gradient(to bottom,
                    rgb(142, 166, 231),
                    rgba(191, 213, 253, 0.5),
                    rgba(255, 255, 255, 1));
            height: 100vh;
            margin: 0;
            font-family:
                ui-sans-serif,
                system-ui,
                sans-serif,
                Apple Color Emoji,
                Segoe UI Emoji,
                Segoe UI Symbol,
                Noto Color Emoji;
            font-size: 16px;
            display: grid;
            grid-template-rows: 70px 1fr 60px;
        }

        header {
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: #004282;
        }

        .logo-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #eb6f2d;
        }

        main {
            background: #fff;
            align-self: center;
            justify-self: center;
            width: min(360px, calc(100vw - 48px));
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 35px rgba(0, 66, 130, 0.12);
        }

        .subtitle {
            margin: 0 0 18px 0;
            color: #6b7280;
            font-size: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            color: rgba(17, 24, 39, 0.7);
            margin-bottom: 6px;
        }

        #prn-input,
        #regid-input {
            height: 40px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            width: calc(100% - 24px - 2px);
            border-radius: 4px;
            padding: 0 12px;
            margin-bottom: 10px;
        }

        #prn-input:focus,
        #regid-input:focus {
            outline: none;
            border-color: #004282;
            box-shadow: 0 0 0 3px rgba(0, 66, 130, 0.15);
        }

        #validate {
            line-height: 40px;
            font-size: 14px;
            background: #004282;
            border-radius: 4px;
            text-align: center;
            width: 100%;
            border: 0;
            color: #fff;
            cursor: pointer;
        }

        #validate:hover {
            background: #005bb6;
        }

        #validate:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #result {
            margin-top: 16px;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            display: none;
        }

        .success {
            background: #ecfdf5;
            border: 1px solid #10b981;
            color: #065f46;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #ef4444;
            color: #7f1d1d;
        }

        #manual-return {
            margin-top: 12px;
            display: none;
        }

        #manual-return button {
            width: 100%;
            line-height: 36px;
            border: 1px solid #004282;
            color: #004282;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            background: #004282;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-dot"></div>
        <h1>PRN Validator</h1>
    </header>

    <main>
        <p class="subtitle">Enter tracking ID and PRN to validate payment status</p>
        <form id="prn-form">
            <label for="regid-input">Tracking ID</label>
            <input id="regid-input" required />
            <label for="prn-input">PRN Number</label>
            <input id="prn-input" required />
            <button id="validate" type="submit">Validate PRN</button>
        </form>
        <div id="result"></div>
        <div id="manual-return">
            <button type="button" id="return-btn">Return to form</button>
        </div>
    </main>

    <footer>Powered by OpenCRVS PRN Mock</footer>

    <script>
        const form = document.getElementById("prn-form");
        const prnInput = document.getElementById("prn-input");
        const regIdInput = document.getElementById("regid-input");
        const validateButton = document.getElementById("validate");
        const result = document.getElementById("result");
        const manualReturn = document.getElementById("manual-return");
        const returnButton = document.getElementById("return-btn");

        const params = new URLSearchParams(window.location.search);
        const redirectUriParam = params.get("redirect_uri");

        function resolveReturnUrl(value) {
            if (!value) {
                return document.referrer || window.location.origin;
            }

            try {
                return new URL(decodeURIComponent(value)).toString();
            } catch (_error) {
                try {
                    return new URL(value).toString();
                } catch (_nestedError) {
                    return document.referrer || window.location.origin;
                }
            }
        }

        const returnUrl = resolveReturnUrl(redirectUriParam);

        function showMessage(type, message) {
            result.className = type;
            result.textContent = message;
            result.style.display = "block";
        }

        function goBackWithStatus(validation) {
            try {
                const destination = new URL(returnUrl);
                destination.searchParams.set(
                    "prnVerificationStatus",
                    validation.prnVerificationStatus || "failed"
                );
                if (validation.prnStatusCode) {
                    destination.searchParams.set("prnStatusCode", validation.prnStatusCode);
                }
                if (validation.prnStatusDescription) {
                    destination.searchParams.set(
                        "prnStatusDescription",
                        validation.prnStatusDescription
                    );
                }
                window.location.replace(destination.toString());
            } catch (_error) {
                manualReturn.style.display = "block";
                showMessage("error", "Could not redirect automatically.");
            }
        }

        returnButton.addEventListener("click", () => {
            if (document.referrer) {
                window.location.replace(document.referrer);
                return;
            }
            window.history.back();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const prn = prnInput.value.trim();
            const regId = regIdInput.value.trim();

            if (!prn) {
                showMessage("error", "Please enter a PRN.");
                return;
            }

            if (!regId) {
                showMessage("error", "Please enter a tracking ID.");
                return;
            }

            validateButton.disabled = true;

            try {
                const response = await fetch("/prn/validate", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({
                        regId,
                        prn,
                        redirect_uri: returnUrl
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage("error", data.message || "Unable to validate PRN.");
                    return;
                }

                if (!data.prnVerificationStatus) {
                    showMessage("error", data.message || "Unable to validate PRN.");
                    return;
                }

                const isPaid = data.prnVerificationStatus === "verified";
                showMessage(
                    isPaid ? "success" : "error",
                    data.message ||
                    (isPaid
                        ? "Payment verified. Returning to form..."
                        : "Payment is not fully paid. Returning to form...")
                );
                setTimeout(() => {
                    goBackWithStatus(data);
                }, isPaid ? 800 : 1200);
            } catch (_error) {
                showMessage("error", "Unable to validate PRN. Please try again.");
            } finally {
                validateButton.disabled = false;
            }
        });
    </script>
</body>

</html>
