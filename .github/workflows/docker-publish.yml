name: "API Server: Build and publish Docker image"

on:
  push:
    branches:
      - main
      - tf_nira_dev
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: technoforte2023/mosip-api

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: technoforte2023
          password: dckr_pat_wImaKcADEeu8nuCtG4eCrgS5MC0

      - name: Extract version from package.json
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/technoforte2023/mosip-api
          tags: |
            type=sha,prefix=
            type=raw,value=${{ env.VERSION }}
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7

      - name: Copy yarn.lock to docker build context
        run: cp yarn.lock packages/mosip-api/yarn.lock

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: packages/mosip-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
